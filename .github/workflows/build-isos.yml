name: Build ConsoleOS Lab ISOs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y nasm g++-multilib binutils grub-pc-bin xorriso
      - name: Build three ISO images
        run: bash scripts/build.sh
      - name: Upload ISO files
        uses: actions/upload-artifact@v4
        with:
          name: consoleos-lab-isos
          path: dist/*.iso
          if-no-files-found: error
          retention-days: 14
